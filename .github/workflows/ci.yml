name: CI

# Run on every PR targeting dev/main, and on every direct push to main.
# dev is intentionally absent from the push trigger: dev/main are protected branches (merge only
# via PR), so anything landing on dev is already covered by the pull_request trigger — keeping
# push:dev too would just run CI twice for the same commits. main still needs push, since
# release-please pushes its own commits/tags there directly once its release PR is merged.
# Skipped when a change only touches release-please's own files (see ci-skip.yml, which reports
# a trivial success for this same check in that case instead).
on:
  pull_request:
    branches: [dev, main]
    paths-ignore:
      - "CatLedger/Resources/Version.xcconfig"
      - ".release-please-manifest.json"
      - "CHANGELOG.md"
  push:
    branches: [main]
    paths-ignore:
      - "CatLedger/Resources/Version.xcconfig"
      - ".release-please-manifest.json"
      - "CHANGELOG.md"

# Only one run at a time per branch/PR: a new run for the same ref cancels whatever was
# already running for it (avoids duplicate runs when a push and a PR event fire close together).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Informational only: never fails the workflow (continue-on-error below) and isn't added to
  # branch protection, so a strict rule can't block a merge. Findings show up as inline PR
  # annotations via SwiftLint's github-actions-logging reporter, no extra service involved.
  lint:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Run SwiftLint (inline PR annotations)
        run: swiftlint lint --reporter github-actions-logging
        continue-on-error: true

      # Second pass, JSON this time: swiftlint only supports one reporter per run, and the
      # "report" job needs structured data rather than the annotation-formatted output above.
      - name: Run SwiftLint (JSON for the report job)
        run: swiftlint lint --reporter json > lint-results.json
        continue-on-error: true

      - name: Upload lint results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-results
          path: lint-results.json
          retention-days: 7

  # Compiles the app and both test targets once, without running anything. "build-for-testing"
  # (rather than plain "build") also produces a .xctestrun file per test plan: a self-contained
  # description of how to launch that test bundle without recompiling. The two downstream test
  # jobs each download their own package and run it via "test-without-building", so the app is
  # only ever compiled here, in one required job — a failure here fails fast, before either test
  # job spends time spinning up a simulator.
  # Two separate -derivedDataPath trees (one per test plan) are used deliberately: xcodebuild
  # names the .xctestrun after the scheme, not the test plan, so building both plans into the
  # same DerivedData would have the second build silently overwrite the first's .xctestrun.
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # Both build-for-testing calls below resolve packages into this same path, so the SPM
      # cache is shared between them even though their derived data trees aren't.
      - name: Cache resolved Swift packages
        uses: actions/cache@v4
        with:
          path: SourcePackages
          key: spm-${{ hashFiles('CatLedger.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-

      - name: Resolve Swift Package dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project CatLedger.xcodeproj \
            -scheme CatLedger \
            -clonedSourcePackagesDirPath SourcePackages

      # Recreates the Firebase config from a repo secret — never committed, see .gitignore.
      # Only needed here: it's a Copy Bundle Resources input, baked into the .app at build time,
      # so the downstream test jobs never need to recreate it themselves.
      - name: Write GoogleService-Info.plist
        run: echo "${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}" | base64 -d > CatLedger/GoogleService-Info.plist

      - name: Build for testing (unit tests)
        run: |
          xcodebuild build-for-testing \
            -project CatLedger.xcodeproj \
            -scheme CatLedger \
            -testPlan CatLedgerTests \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath DerivedData-unit \
            -clonedSourcePackagesDirPath SourcePackages \
            CODE_SIGNING_ALLOWED=NO

      - name: Build for testing (E2E tests)
        run: |
          xcodebuild build-for-testing \
            -project CatLedger.xcodeproj \
            -scheme CatLedger \
            -testPlan CatLedgerE2ETests \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath DerivedData-e2e \
            -clonedSourcePackagesDirPath SourcePackages \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload unit test build
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-build
          path: DerivedData-unit/Build/Products
          retention-days: 1

      - name: Upload E2E test build
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-build
          path: DerivedData-e2e/Build/Products
          retention-days: 1

  # Required. Runs the pre-built unit test bundle from "build" — no recompilation here.
  test:
    needs: build
    runs-on: macos-latest
    steps:
      - name: Select Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Download unit test build
        uses: actions/download-artifact@v4
        with:
          name: unit-test-build
          path: Products

      # Unlike "latest-stable" above, xcodebuild has no "any available device" keyword, so this
      # device name is the one place that may need adjusting if it isn't on the runner (the
      # failure log lists the actually available simulators).
      - name: Run unit tests
        run: |
          xcodebuild test-without-building \
            -xctestrun Products/*.xctestrun \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            -resultBundlePath TestResults/unit.xcresult

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: TestResults/unit.xcresult
          retention-days: 7

  # Informational only, same reasoning as lint: never fails the workflow (continue-on-error
  # below) and isn't added to branch protection. The Firebase emulator is more prone to CI-only
  # flakiness than the unit tests, so this stays observational until it's proven stable.
  e2e-test:
    needs: build
    runs-on: macos-latest
    steps:
      # firebase.json lives at the repo root, so emulators:exec needs it — but nothing else from
      # the source tree, since the tests themselves are already built. This runs *before*
      # downloading the build artifact below: actions/checkout deletes the contents of the
      # workspace before checking out, which would silently wipe the downloaded Products/
      # directory (including the .xctestrun) if it ran afterward instead.
      - name: Checkout firebase.json
        uses: actions/checkout@v4
        with:
          sparse-checkout: firebase.json
          sparse-checkout-cone-mode: false

      - name: Select Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Download E2E test build
        uses: actions/download-artifact@v4
        with:
          name: e2e-test-build
          path: Products

      # GitHub's macOS runners ship Node.js, so npm is the fastest way to get the CLI here —
      # no need for the Homebrew formula used for local setup.
      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      # "emulators:exec" starts the emulators, waits until they're ready, runs the given command,
      # then tears the emulators down and propagates its exit code — no manual polling needed.
      # The xctestrun path is resolved into a variable *before* being handed to emulators:exec:
      # "*" doesn't expand inside the double-quoted command string below, so xcodebuild would
      # otherwise receive the literal, unexpanded "Products/*.xctestrun" and find no test bundle.
      - name: Run E2E tests against the Firebase emulators
        continue-on-error: true
        run: |
          XCTESTRUN=$(ls Products/*.xctestrun)
          firebase emulators:exec --only auth,firestore \
            "xcodebuild test-without-building \
              -xctestrun '$XCTESTRUN' \
              -destination 'platform=iOS Simulator,name=iPhone 17' \
              -resultBundlePath TestResults/e2e.xcresult"

      - name: Upload E2E test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: TestResults/e2e.xcresult
          retention-days: 7

  # Always runs, even if test/e2e-test failed — that's exactly when a summary is most useful.
  # Posts a human-readable pass/fail breakdown straight into the run's own summary page, so
  # debugging a failure doesn't require downloading and opening an .xcresult bundle in Xcode
  # first; the bundles themselves are still attached above for when that's actually needed.
  report:
    needs: [lint, test, e2e-test]
    if: always()
    runs-on: macos-latest
    steps:
      - name: Download lint results
        if: always()
        uses: actions/download-artifact@v4
        with:
          name: lint-results
          path: LintResults
        continue-on-error: true

      - name: Download unit test results
        if: always()
        uses: actions/download-artifact@v4
        with:
          name: unit-test-results
          path: TestResults/unit.xcresult
        continue-on-error: true

      - name: Download E2E test results
        if: always()
        uses: actions/download-artifact@v4
        with:
          name: e2e-test-results
          path: TestResults/e2e.xcresult
        continue-on-error: true

      # xcresulttool's exact JSON shape can shift between Xcode versions — this is a first pass,
      # written to degrade to "see the downloaded bundle above" rather than fail the job outright
      # if a field it expects isn't there.
      - name: Summarize test results
        if: always()
        run: |
          {
            echo "## Lint"
            if [ -f "LintResults/lint-results.json" ]; then
              jq -r 'if length == 0 then "No violations." else
                "- Violations: \(length)\n\nTop offenders:\n" +
                ([.[] | "\(.file | split("/") | last):\(.line) — \(.reason)"] | .[0:10] | map("- " + .) | join("\n"))
                end' LintResults/lint-results.json \
                || echo "_Could not parse lint-results.json — download the lint-results artifact._"
            else
              echo "_No lint results (job may not have run)._"
            fi

            echo ""
            echo "## Test results"
            for bundle in "unit:TestResults/unit.xcresult" "e2e:TestResults/e2e.xcresult"; do
              label="${bundle%%:*}"
              path="${bundle#*:}"
              echo ""
              echo "### ${label}"
              if [ ! -d "$path" ]; then
                echo "_No result bundle (job may not have run)._"
                continue
              fi
              xcrun xcresulttool get test-results summary --path "$path" --format json > summary.json 2>/dev/null \
                && jq -r '"- Passed: \(.passedTests // "?")\n- Failed: \(.failedTests // "?")\n- Skipped: \(.skippedTests // "?")"' summary.json \
                || echo "_Could not parse summary — download the ${label}-test-results artifact and open it in Xcode._"
            done
          } >> "$GITHUB_STEP_SUMMARY"
