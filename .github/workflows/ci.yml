name: CI

# Run on every PR targeting dev/main, and on every direct push to main.
# dev is intentionally absent from the push trigger: dev/main are protected branches (merge only
# via PR), so anything landing on dev is already covered by the pull_request trigger — keeping
# push:dev too would just run CI twice for the same commits. main still needs push, since
# release-please pushes its own commits/tags there directly once its release PR is merged.
# Skipped when a change only touches release-please's own files (see ci-skip.yml, which reports
# a trivial success for this same check in that case instead).
on:
  pull_request:
    branches: [dev, main]
    paths-ignore:
      - "CatLedger/Resources/Version.xcconfig"
      - ".release-please-manifest.json"
      - "CHANGELOG.md"
  push:
    branches: [main]
    paths-ignore:
      - "CatLedger/Resources/Version.xcconfig"
      - ".release-please-manifest.json"
      - "CHANGELOG.md"

# Only one run at a time per branch/PR: a new run for the same ref cancels whatever was
# already running for it (avoids duplicate runs when a push and a PR event fire close together).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Informational only: never fails the workflow (continue-on-error below) and isn't added to
  # branch protection, so a strict rule can't block a merge. Findings show up as inline PR
  # annotations via SwiftLint's github-actions-logging reporter, no extra service involved.
  lint:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Run SwiftLint
        run: swiftlint lint --reporter github-actions-logging
        continue-on-error: true

  build-and-test:
    # "macos-latest" always resolves to GitHub's current default macOS image, so this stays
    # correct without us tracking Apple/GitHub's release naming over time.
    runs-on: macos-latest
    steps:
      # Clone the repo at the commit that triggered this run.
      - name: Checkout
        uses: actions/checkout@v4

      # GitHub's macOS runners ship several Xcode versions at once; pick the one we build with.
      # No official GitHub action does this, so we use this popular, widely-used third-party one.
      # "latest-stable" avoids hardcoding a version number that may not exist on the runner yet.
      - name: Select Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # Xcode normally resolves packages into a hashed, unpredictable DerivedData path, which
      # can't be cached reliably. Pin a fixed path instead (used by every xcodebuild call below)
      # so the cache step can target it consistently across runs. No package is added yet, so
      # this is a no-op for now and will start paying off once Firebase is added.
      - name: Cache resolved Swift packages
        uses: actions/cache@v4
        with:
          path: DerivedData/SourcePackages
          key: spm-${{ hashFiles('CatLedger.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-

      # Fetch Swift Package dependencies as its own step, so it's visible in the logs
      # separately from the actual build. A cache hit above makes this near-instant.
      - name: Resolve Swift Package dependencies
        run: xcodebuild -resolvePackageDependencies -project CatLedger.xcodeproj -scheme CatLedger -derivedDataPath DerivedData

      # Recreates the Firebase config from a repo secret — never committed, see .gitignore.
      - name: Write GoogleService-Info.plist
        run: echo "${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}" | base64 -d > CatLedger/GoogleService-Info.plist

      # Compile the app for the iOS Simulator. No real device/certificate involved, so no code
      # signing is needed.
      - name: Build
        run: |
          xcodebuild build \
            -project CatLedger.xcodeproj \
            -scheme CatLedger \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO

      # Run the unit tests on an actual simulator instance, since "test" needs a concrete device
      # to run the app on, unlike "build" which only needs a platform.
      # Unlike "latest-stable" above, xcodebuild has no "any available device" keyword, so this
      # device name is the one place that may need adjusting if it isn't on the runner (the
      # failure log lists the actually available simulators).
      # -testPlan is explicit: without it, xcodebuild builds every test target attached to the
      # scheme's Test action, not just the default plan — which would also build
      # CatLedgerE2ETests here, even though it needs the Firebase emulator this runner doesn't have.
      - name: Test
        run: |
          xcodebuild test \
            -project CatLedger.xcodeproj \
            -scheme CatLedger \
            -testPlan CatLedgerTests \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO
