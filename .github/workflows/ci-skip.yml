name: CI

# Reports an immediate success for the "build" and "test" checks (same job names as ci.yml) for
# release-please's own release PRs, so the required status checks are satisfied without a real
# build — a version bump alone can't break the app, re-running the full suite would be wasted time.
#
# Gated on the PR author being release-please's bot, not just on the changed paths: a `paths:`
# trigger fires whenever ANY changed file matches, not only when EVERY changed file does — GitHub
# Actions has no "all files match" path condition. A broader PR (e.g. promoting dev to main) can
# easily carry both real code and these release-please files in the same diff, which used to fire
# this trivial workflow *alongside* ci.yml's real one, on the same PR, both reporting under the
# same "CI" name — confusing, and briefly a false "build passed" before the real one finished.
# Restricting to the bot's own PRs makes the two workflows mutually exclusive again: that PR only
# ever touches these three files, so ci.yml's paths-ignore already skips it independently.
#
# No push trigger: dev and main are both protected branches (merge only via PR), so this is
# already covered by the pull_request trigger — see ci.yml for the full reasoning.
on:
  pull_request:
    branches: [dev, main]
    paths:
      - "CatLedger/Resources/Version.xcconfig"
      - ".release-please-manifest.json"
      - "CHANGELOG.md"

jobs:
  # Must mirror ci.yml's job names exactly — GitHub matches branch protection required checks
  # by job name, so these trivial jobs satisfy the same requirements without doing real work.
  build:
    if: github.event.pull_request.user.login == 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - run: echo "release-please's own PR, skipping the real build."

  test:
    if: github.event.pull_request.user.login == 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - run: echo "release-please's own PR, skipping the real tests."

  lint:
    if: github.event.pull_request.user.login == 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - run: echo "release-please's own PR, skipping lint."
